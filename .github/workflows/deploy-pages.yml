name: Deploy privacy policy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/google-play-privacy-policy-r6960e
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 여러 배포가 겹치지 않도록 하되, 진행 중인 배포는 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # github-pages 환경은 "기본 브랜치에서 출발한 배포"만 허용한다.
    # 기본 브랜치가 아닌 곳에서 돌면 스텝을 하나도 밟지 못하고 실패하므로
    # (Actions 로그에 스텝이 안 찍히는 그 증상) 아예 건너뛴다.
    # 이렇게 두면 기본 브랜치를 main 으로 바꿔도 워크플로를 고칠 필요가 없다.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 저장소 Settings > Pages > Source 가 "GitHub Actions" 로 지정돼 있어야 한다.
      # 최초 활성화는 GITHUB_TOKEN 권한 밖이라 (Resource not accessible by integration)
      # 워크플로가 대신 켜줄 수 없다. 한 번만 사람이 지정하면 이후로는 자동이다.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # 공개하는 것은 개인정보처리방침과 계정 삭제 요청 페이지 둘뿐이다.
      # 계정 삭제 페이지는 Play 콘솔의 "계정 삭제 요청 URL" 로 등록한다.
      # README·데이터 안전 가이드는 저장소 문서이므로 사이트에 올리지 않는다.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html delete-account.html _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
