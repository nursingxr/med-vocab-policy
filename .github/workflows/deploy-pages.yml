name: Deploy privacy policy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 여러 배포가 겹치지 않도록 하되, 진행 중인 배포는 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 저장소 Settings > Pages > Source 가 "GitHub Actions" 로 지정돼 있어야 한다.
      # 최초 활성화는 GITHUB_TOKEN 권한 밖이라 (Resource not accessible by integration)
      # 워크플로가 대신 켜줄 수 없다. 한 번만 사람이 지정하면 이후로는 자동이다.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # 공개할 파일은 개인정보처리방침 본문 하나뿐이다.
      # README·데이터 안전 가이드는 저장소 문서이므로 사이트에 올리지 않는다.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
